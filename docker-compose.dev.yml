version: '3.8'

networks:
  traffic-vision-network:
    driver: bridge

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: traffic-vision-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_vision_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - traffic-vision-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend (Development)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic-vision-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Development volumes (live code reload)
      - ./backend:/app
      - backend_dev_uploads:/app/uploads
      - backend_dev_results:/app/results
      - backend_dev_models:/app/models
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres123}@database:5432/traffic_vision_dev
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_not_for_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      database:
        condition: service_healthy
    networks:
      - traffic-vision-network

  # React Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder  # Stop at builder stage for development
    container_name: traffic-vision-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Development volumes (live code reload)
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host --port 3000
    depends_on:
      - backend
    networks:
      - traffic-vision-network

volumes:
  postgres_dev_data:
    driver: local
  backend_dev_uploads:
    driver: local
  backend_dev_results:
    driver: local
  backend_dev_models:
    driver: local
